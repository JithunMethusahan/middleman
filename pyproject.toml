[project]
name = "middleman-mcp"
version = "0.1.0"
description = "Universal MCP Proxy Gateway for Context Refinement"
authors = [{name = "Jithun Methusahan"}]
dependencies = [
    "mcp>=0.1.0",
    "openai>=1.10.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0"
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
middleman = "server:mcp.run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"